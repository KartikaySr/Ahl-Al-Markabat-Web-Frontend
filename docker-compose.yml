version: '3.8'

services:
  # 1. PostgreSQL 16 with PostGIS 3.4
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ahl_postgres
    restart: always
    environment:
      POSTGRES_DB: ahl_almarkabat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis 7 for BullMQ & Caching
  redis:
    image: redis:7-alpine
    container_name: ahl_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: ahl_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # 4. Python FastAPI AI Microservice
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ahl_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      HOST: "0.0.0.0"

  # 5. NestJS Enterprise Backend API & WebSocket Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ahl_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/ahl_almarkabat?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      AI_SERVICE_URL: "http://ai-service:8000"
      JWT_SECRET: "super-secret-ahl-markabat-jwt-token-key-2026"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY: "minioadmin"
      S3_SECRET_KEY: "minioadminpassword"

  # 6. Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: ahl_nginx
    restart: always
    depends_on:
      - backend
      - ai-service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
